<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7ef" />
    <script>
      const preference = localStorage.getItem('a-minos-theme')
      if (preference === 'light' || preference === 'dark') {
        document.documentElement.dataset.theme = preference
      }
    </script>
    <meta
      name="description"
      content="A-Minos，一个为 Tetris 社区做点有趣东西的开源组织。玩家数据、中文支持、开发工具，把我们对方块的热爱，拼在一起。"
    />
    <meta property="og:title" content="A-Minos — 把热爱，拼在一起。" />
    <meta
      property="og:description"
      content="为方块而来，不止于方块。探索 A-Minos 的开源工具与社区。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://a-minos.org/" />
    <link rel="canonical" href="https://a-minos.org/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>A-Minos — 把热爱，拼在一起。</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
